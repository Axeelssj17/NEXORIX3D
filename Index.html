<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexorix 3D · Tienda</title>
<style>
:root{--bg:#05060d;--card:#0d0f1c;--c2:#141730;--ink:#eef0ff;--mute:#8d93b5;--line:#22264a;--a:#3b6cff;--b:#8b5cf6;--g:linear-gradient(120deg,#22d3ee,#3b6cff 45%,#8b5cf6 75%,#d946ef)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#1b1450 0,transparent 70%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(5,6,13,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px}
.logo img{height:34px;mix-blend-mode:screen}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px}
.btn.p{background:var(--g);border:0;font-weight:700;color:#fff}
main{max-width:1100px;margin:auto;padding:36px 20px 70px}
h1{font-size:clamp(28px,5.5vw,46px);margin:0 0 8px;line-height:1.1;letter-spacing:-1px}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 28px;max-width:560px}
.demo{display:none;font-size:13px;color:#c4b5fd;border:1px dashed var(--b);border-radius:10px;padding:8px 12px;margin-bottom:20px}
.filters{display:grid;gap:14px;margin-bottom:28px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;min-width:76px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 15px;font-size:14px}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
select,input[type=text],input[type=email],input[type=tel],textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
select{padding:7px 10px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;margin-bottom:10px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--b);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;transition:.2s}
.card:hover{border-color:var(--b);transform:translateY(-3px)}
.tile{aspect-ratio:4/3;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#111538,#1d1148)}
.tile img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;font-size:12px;padding:3px 11px;border-radius:999px;background:rgba(5,6,13,.75);border:1px solid var(--line)}
.tag.now{background:var(--g);border:0;color:#fff;font-weight:600}
.info{padding:14px 16px 16px;display:grid;gap:4px}
.mut{color:var(--mute);font-size:13px}
.price{font-weight:800;margin-top:6px;font-size:17px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20;justify-content:center;align-items:flex-end}
.ov.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
h2{margin:0 0 4px;font-size:22px}
.fld{margin:16px 0}.fld .lab{display:block;margin-bottom:6px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:12px}
.dl span:nth-child(odd){color:var(--mute)}
.slot{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;width:36px;height:36px;font-size:18px}
.qty span{min-width:28px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.x{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:13px;padding:0}
.ok{text-align:center;padding:10px 0}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.err{color:#fda4af;font-size:13px;margin-top:8px}
.car{position:relative;border-radius:14px;overflow:hidden;background:var(--c2);aspect-ratio:4/3;margin:12px 0}
.car img,.car video,.car iframe{width:100%;height:100%;object-fit:cover;border:0;display:block;animation:fi .25s}
@keyframes fi{from{opacity:.3}to{opacity:1}}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(5,6,13,.65);color:#fff;font-size:26px;line-height:1;padding:0 0 3px}
.ar.l{left:8px}.ar.r{right:8px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}
</style>
</head>

const list_=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const mediaDe=d=>{const m=Array.isArray(d.media)?d.media.filter(x=>x&&/^https:/i.test(x.url||'')).map(x=>({tipo:x.tipo=='video'?'video':'imagen',url:String(x.url)})):[];return m.length?m:(/^https:/i.test(d.imagen||'')?[{tipo:'imagen',url:String(d.imagen)}]:[])};
const norm=(d,id)=>{const media=mediaDe(d),f=media.find(x=>x.tipo=='imagen');return{id,codigo:d.codigo||id,nombre:d.nombre||'Producto',cat:d.categoria||'Hogar',m:d.medidas||'',fil:list_(d.filamentos),base:list_(d.colores),media,img:f?f.url:'',nc:Math.max(1,Math.min(4,parseInt(d.cantidadColores)||1)),pr:Number(d.precio)||0,now:d.entregaInmediata===true||d.entregaInmediata==='Sí'}};
let P=[],demo=false;
try{P=(await getDocs(collection(db,'productos'))).docs.map(d=>norm(d.data(),d.id))}catch(e){console.warn('Firestore:',e)}
if(!P.length){P=DEMO.map(d=>norm(d,d.codigo));demo=true;$('demo').style.display='block'}
P.forEach(p=>{if(!p.fil.length)p.fil=['PLA'];if(!p.base.length)p.base=['Negro']});

// ===== UI =====
let F={cat:'Todos',fil:'',col:'',now:false},cart=[],cur=null,sel=[],qty=1,fil='';
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const COLL=Object.fromEntries(Object.entries(COL).map(([k,v])=>[nz(k),v]));
const hex=k=>COLL[nz(k)]||'#8a8d91';
function chips(){
  $('fc').innerHTML=CATS.map(c=>`<button class="chip ${F.cat==c?'on':''}" data-c="${c}">${c}</button>`).join('');
  $('fk').innerHTML=Object.keys(COL).map(k=>`<button class="sw ${F.col==k?'on':''}" data-k="${k}" title="${k}" aria-label="${k}" style="background:${COL[k]}"></button>`).join('');
}
function tile(p){return p.img?`<img src="${esc(p.img)}" alt="${esc(p.nombre)}" loading="lazy">`:`<svg width="84" height="84" viewBox="0 0 84 84"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b6cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M42 8l30 17v34L42 76 12 59V25z" fill="url(#gg)"/><path d="M42 42l30-17M42 42L12 25M42 42v34" stroke="#05060d" stroke-width="2" fill="none" opacity=".5"/></svg>`}
function list(){
  const r=P.filter(p=>(F.cat=='Todos'||nz(p.cat)==nz(F.cat))&&(!F.fil||p.fil.some(x=>nz(x)==nz(F.fil)))&&(!F.now||p.now)&&(!F.col||p.base.some(b=>nz(b)==nz(F.col))));
  $('g').innerHTML=r.length?r.map(p=>`<button class="card" data-p="${esc(p.id)}"><div class="tile"><span class="tag ${p.now?'now':''}">${p.now?'Entrega inmediata':'Bajo pedido'}</span>${tile(p)}</div>
   <div class="info"><span class="mut">${esc(p.codigo)} · ${esc(p.cat)}</span><b>${esc(p.nombre)}</b><span class="mut">${esc(p.m)} · ${esc(p.fil.join(' / '))}</span><span class="price">${money(p.pr)}</span></div></button>`).join(''):'<p class="mut">No hay productos con esos filtros.</p>';
}
const sw=(i,k)=>`<button class="sw ${sel[i]==k?'on':''}" data-s="${i}|${k}" title="${k}" aria-label="${k}" style="background:${hex(k)}"></button>`;
let mi=0,ask=false;
function openP(){mi=0;ask=false;
  $('s1').innerHTML=`<div class="row" style="justify-content:space-between"><span class="mut">${esc(cur.codigo)}</span><button class="x" data-close="o1">Cerrar</button></div><h2>${esc(cur.nombre)}</h2><div class="car" id="cm"></div><div id="ci"></div>`;car();detail()}
function car(){
  const m=cur.media,x=m[mi],c=$('cm');
  if(!x){c.innerHTML=`<div class="tile" style="height:100%">${tile(cur)}</div>`;return}
  c.innerHTML=(x.tipo=='video'?(/\.(mp4|webm)(\?|$)/i.test(x.url)?`<video src="${esc(x.url)}" controls playsinline></video>`:`<iframe src="${esc(x.url)}" allow="autoplay;fullscreen" allowfullscreen></iframe>`):`<img src="${esc(x.url)}" alt="${esc(cur.nombre)}">`)+
  (m.length>1?`<button class="ar l" data-n="-1" aria-label="Anterior">‹</button><button class="ar r" data-n="1" aria-label="Siguiente">›</button><div class="dots">${m.map((_,i)=>`<i class="${i==mi?'on':''}"></i>`).join('')}</div>`:'');
}
function detail(){
  const p=cur,L=p.nc==1?['Color']:['Primario','Secundario','Terciario','Cuarto'],c=$('ci');
  if(ask){c.innerHTML=`<form id="qf"><div class="fld"><span class="lab">Consultar otro color</span>
   <div class="mut" style="margin-bottom:10px">Contanos qué color buscás y te respondemos a tu contacto.</div>
   <input type="text" name="nombre" placeholder="Tu nombre" required><input type="text" name="contacto" placeholder="Mail o celular" required>
   <input type="text" name="color" placeholder="Color que te interesa" required><textarea name="mensaje" rows="2" placeholder="Mensaje (opcional)"></textarea></div>
   <button class="btn p" id="qs" style="width:100%;padding:12px">Enviar consulta</button>
   <button type="button" class="x" data-back style="display:block;margin:12px auto 0">Volver al producto</button><div id="qe"></div></form>`;return}
  c.innerHTML=`<div class="mut">${p.now?'Entrega inmediata':'Bajo pedido · 3 a 5 días'}</div>
  <div class="dl"><span>Medidas</span><span>${esc(p.m)}</span><span>Filamento</span><span>${esc(FIL[fil]||fil)}</span></div>
  <div class="fld"><span class="lab">Filamento</span><div class="row">${p.fil.map(x=>`<button class="chip ${fil==x?'on':''}" data-f="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
  <div class="fld"><span class="lab">Colores</span>${sel.map((c,i)=>`<div class="slot"><span class="lab">${L[i]}</span><span class="row">${p.base.map(k=>sw(i,k)).join('')}</span></div>`).join('')}
   <div class="mut">${p.nc>1?'Este producto combina '+p.nc+' colores: elegí cada uno entre los disponibles.':'Elegí entre los colores disponibles.'}</div>
   <button type="button" class="x" data-ask style="margin-top:8px">¿Querés otro color? Consultanos</button></div>
  <div class="fld row" style="justify-content:space-between"><div class="qty"><button data-q="-1">−</button><span>${qty}</span><button data-q="1">+</button></div><b>${money(p.pr*qty)}</b></div>
  <button class="btn p" style="width:100%;padding:12px" data-add>Agregar al pedido</button>`;
}
function cartView(err){
  $('cb').textContent=`Pedido (${cart.reduce((a,i)=>a+i.q,0)})`;
  const t=cart.reduce((a,i)=>a+i.p.pr*i.q,0);
  $('s2').innerHTML=`<div class="row" style="justify-content:space-between"><h2>Tu pedido</h2><button class="x" data-close="o2">Cerrar</button></div>`+
  (cart.length?cart.map((i,n)=>`<div class="line"><div><b>${esc(i.p.nombre)}</b> × ${i.q}<div class="mut">${esc(i.p.codigo)} · ${esc(i.fil)} · ${esc(i.col.join(' / '))} · ${esc(i.p.m)}</div><button class="x" data-rm="${n}">Quitar</button></div><b>${money(i.p.pr*i.q)}</b></div>`).join('')+
  `<div class="line"><span>Total</span><b>${money(t)}</b></div>
  <form id="fm"><div class="fld"><span class="lab">Tus datos</span>
  <div class="two"><input type="text" name="nombre" placeholder="Nombre" required><input type="text" name="apellido" placeholder="Apellido" required></div>
  <input type="email" name="mail" placeholder="Mail" required><input type="text" name="direccion" placeholder="Dirección de entrega" required><input type="tel" name="numero" placeholder="Celular" required>
  <textarea name="notas" rows="2" placeholder="Notas del pedido (opcional)"></textarea></div>
  <button class="btn p" id="send" style="width:100%;padding:12px">Confirmar pedido</button>${err?'<div class="err">No pudimos enviar el pedido. Probá de nuevo en unos minutos.</div>':''}</form>`:'<p class="mut">Todavía no agregaste productos.</p>');
}
async function send(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=$('send');b.disabled=true;b.textContent='Enviando…';
  const no='NX-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const o={numeroPedido:no,cliente:{nombre:f.nombre,apellido:f.apellido,mail:f.mail},direccionEntrega:f.direccion,numero:f.numero,notas:f.notas||'',
   items:cart.map(i=>({codigo:i.p.codigo,nombre:i.p.nombre,cantidad:i.q,filamento:i.fil,colores:i.col.join(', '),medidas:i.p.m,precio:i.p.pr})),
   total:cart.reduce((a,i)=>a+i.p.pr*i.q,0),estado:'nuevo'};
  try{
    await addDoc(collection(db,'pedidos'),{...o,creado:serverTimestamp()});
    if(APPS_SCRIPT_URL)fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{});
  }catch(er){console.error(er);cartView(true);return}
  const codes=cart.map(i=>i.p.codigo).join(', ');cart=[];$('cb').textContent='Pedido (0)';
  $('s2').innerHTML=`<div class="ok"><h2 class="gt">¡Pedido recibido!</h2><p>Tu número de pedido es</p><h1 class="gt">${no}</h1><p class="mut">Referencias: ${esc(codes)}</p><p class="mut">Te escribiremos a ${esc(f.mail)} para coordinar pago y entrega.</p><button class="btn p" data-close="o2">Volver a la tienda</button></div>`;
}
const avisar=o=>{if(APPS_SCRIPT_URL)fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{})};
async function consulta(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=$('qs');b.disabled=true;b.textContent='Enviando…';
  const o={tipo:'consulta',producto:cur.nombre,codigo:cur.codigo,nombre:f.nombre,contacto:f.contacto,colorDeseado:f.color,mensaje:f.mensaje||''};
  try{
    const {tipo,...d}=o;await addDoc(collection(db,'consultas'),{...d,estado:'nueva',creado:serverTimestamp()});avisar(o);
  }catch(er){console.error(er);b.disabled=false;b.textContent='Enviar consulta';$('qe').innerHTML='<div class="err">No pudimos enviar la consulta. Probá de nuevo en unos minutos.</div>';return}
  $('ci').innerHTML=`<div class="ok"><h2 class="gt">¡Consulta enviada!</h2><p class="mut">Te respondemos a ${esc(f.contacto)} a la brevedad.</p><button class="btn p" data-back>Volver al producto</button></div>`;
}
let tx=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('#cm'))tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!e.target.closest('#cm')||cur.media.length<2)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){mi=(mi+(dx<0?1:-1)+cur.media.length)%cur.media.length;car()}});
$('ff').innerHTML='<option value="">Todos los filamentos</option>'+Object.keys(FIL).map(f=>`<option>${f}</option>`).join('');
$('ff').onchange=e=>{F.fil=e.target.value;list()};
$('fi').onchange=e=>{F.now=e.target.checked;list()};
$('cb').onclick=()=>{cartView();$('o2').classList.add('show')};
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.ov');if(!t)return;const d=t.dataset;
  if(t.classList.contains('ov')){if(e.target===t)t.classList.remove('show');return}
  if(d.c){F.cat=d.c;chips();list()}
  else if(d.k){F.col=F.col==d.k?'':d.k;chips();list()}
  else if(d.p){cur=P.find(p=>p.id==d.p);fil=cur.fil[0];qty=1;sel=Array.from({length:cur.nc},(_,i)=>cur.base[i]||cur.base[0]);openP();$('o1').classList.add('show')}
  else if(d.n){mi=(mi+ +d.n+cur.media.length)%cur.media.length;car()}
  else if(d.ask!==undefined){ask=true;detail()}
  else if(d.back!==undefined){ask=false;detail()}
  else if(d.f){fil=d.f;detail()}
  else if(d.s){const[i,k]=d.s.split('|');sel[i]=k;detail()}
  else if(d.q){qty=Math.max(1,Math.min(50,qty+ +d.q));detail()}
  else if(d.add!==undefined){cart.push({p:cur,q:qty,fil,col:sel.slice()});$('o1').classList.remove('show');cartView()}
  else if(d.rm){cart.splice(+d.rm,1);cartView()}
  else if(d.close){$(d.close).classList.remove('show')}
});
document.addEventListener('submit',e=>e.target.id=='qf'?consulta(e):send(e));
chips();list();
</script>
</body>
</html>
